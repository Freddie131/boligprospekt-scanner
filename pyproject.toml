[project]
name = "boligprospekt-scanner"
version = "0.1.0"
description = "MVP for ranking rental/investment property prospects in Southern Norway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "pydantic-settings>=2.3.0",
  "structlog>=24.2.0",
  "jinja2>=3.1.4",
  "weasyprint>=62.3",
  "python-dateutil>=2.9.0",
  "httpx>=0.27.0",
  "geopy>=2.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
